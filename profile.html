<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="logo-icon">🛒</div><span>AGS</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html" class="nav-cart">🛒 Cart<span class="cart-badge" style="display:none">0</span></a></li>
    </ul>
    <button class="dark-toggle">🌙</button>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>
<nav class="nav-mobile" id="nav-mobile">
  <a href="index.html">🏠 Home</a><a href="products.html">📦 Products</a><a href="cart.html">🛒 Cart</a>
</nav>

<div class="profile-wrap fade-in">
  <h2 style="margin-bottom:24px">My Profile</h2>
  <div class="profile-card" id="profile-content">
    <p style="color:var(--text-2)">Loading…</p>
  </div>
</div>

<footer class="footer" style="margin-top:60px">
  <div class="container"><div class="footer-bottom"><p>© 2025 Ankit General Store (AGS)</p></div></div>
</footer>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { requireAuth, logoutUser, getUserDoc } from "./js/auth.js";
  import { updateCartBadge, initDarkMode, formatDate, showToast } from "./js/utils.js";
  import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { db } from "./js/firebase.js";

  initDarkMode();
  updateCartBadge();
  document.getElementById("hamburger")?.addEventListener("click", () => document.getElementById("nav-mobile")?.classList.toggle("open"));

  const user = await requireAuth("login.html");
  const userDoc = await getUserDoc(user.uid).catch(() => null);

  // Fetch order history
  let orders = [];
  try {
    const snap = await getDocs(query(collection(db, "orders"), where("customerUID","==",user.uid), orderBy("date","desc")));
    orders = snap.docs.map(d => d.data());
  } catch(e) {}

  const initials = (user.displayName||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
  const joined = userDoc?.createdAt ? formatDate(userDoc.createdAt) : "—";

  document.getElementById("profile-content").innerHTML = `
    <div class="profile-avatar">${initials}</div>
    <h2 class="profile-name">${user.displayName || "User"}</h2>
    <p class="profile-email">${user.email}</p>

    <div class="profile-row"><span>Full Name</span><strong>${user.displayName||"—"}</strong></div>
    <div class="profile-row"><span>Email</span><strong>${user.email}</strong></div>
    <div class="profile-row"><span>Member Since</span><strong>${joined}</strong></div>
    <div class="profile-row"><span>Total Orders</span><strong>${orders.length}</strong></div>

    <div style="margin-top:24px">
      <h3 style="margin-bottom:16px;font-size:1rem">Recent Orders</h3>
      ${orders.length===0
        ? `<p style="color:var(--text-2);font-size:.9rem">No orders yet. <a href="products.html" style="color:var(--green)">Start shopping →</a></p>`
        : orders.slice(0,5).map(o=>`
          <div style="padding:12px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:10px;font-size:.88rem;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
              <strong>${o.orderId||"—"}</strong>
              <span style="color:var(--text-2)">${formatDate(o.date)}</span>
            </div>
            <div style="color:var(--text-2)">${(o.products||[]).map(p=>p.name+"×"+p.qty).join(", ")}</div>
            <div style="color:var(--green);font-weight:700;margin-top:4px">₹${o.totalAmount}</div>
          </div>`).join("")}
    </div>

    <div style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;">
      <a href="products.html" class="btn btn-green" style="flex:1;justify-content:center">🛍 Shop Now</a>
      <button id="logout-btn" class="btn btn-danger" style="flex:1">Logout</button>
    </div>`;

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await logoutUser();
    showToast("Logged out!", "info");
    setTimeout(() => window.location.href = "index.html", 600);
  });
</script>
</body>
</html>
