<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · AGS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Mukta:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <h1>Admin</h1>
      <p id="gate" class="err">Check ho raha hai...</p>
      <div id="panel" hidden>
        <h2>Product add / edit</h2>
        <form id="pform" class="box">
          <input type="hidden" name="id" />
          <input name="name" placeholder="Product naam" required />
          <input
            name="price"
            type="number"
            min="0"
            step="1"
            placeholder="Price ₹"
            required
          />
          <input
            name="category"
            placeholder="Category (Grocery, Household...)"
            required
          />
          <input name="stock" type="number" min="0" placeholder="Stock" required />
          <input name="imageUrl" placeholder="Image URL (optional)" />
          <label>
            <input type="checkbox" name="active" checked />
            Dikhao (active)
          </label>
          <button class="btn">Save product</button>
        </form>
        <div id="plist"></div>
        <h2>Orders</h2>
        <div id="olist" class="grid"></div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/admin.js"></script>
  </body>
</html>
