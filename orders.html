<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – AGS Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ── */
    :root {
      --green:         #2d7a3a;
      --green-light:   #3a9e4a;
      --green-pale:    #e8f5eb;
      --saffron:       #e07b1a;
      --saffron-light: #f5a144;
      --saffron-pale:  #fff3e0;
      --bg:            #f5f7f5;
      --surface:       #ffffff;
      --border:        #d6e8d8;
      --text:          #1a2e1d;
      --text-muted:    #5a7060;
      --danger:        #c0392b;
      --shadow:        0 2px 12px rgba(45,122,58,0.10);
      --radius:        12px;
    }
    [data-theme="dark"] {
      --bg:          #121a13;
      --surface:     #1e2b20;
      --border:      #2d4030;
      --text:        #e2efe4;
      --text-muted:  #8aaa8f;
      --green:       #4caf60;
      --green-pale:  #1a2e1d;
      --saffron:     #f5a144;
      --saffron-pale:#2e1f0a;
      --shadow:      0 2px 12px rgba(0,0,0,0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--green);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .topbar-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar-brand span { color: #f5a144; }
    .topbar-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .btn-back {
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.25); }

    /* ── Page Wrap ── */
    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .page-wrap h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }
    .page-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px 40px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 0.9rem; color: var(--text-muted); }

    /* ── Auth Gate ── */
    #auth-gate {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 70px 24px;
      text-align: center;
      gap: 10px;
    }
    #auth-gate .gate-icon { font-size: 3rem; }
    #auth-gate h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      color: var(--text);
    }
    #auth-gate p { color: var(--text-muted); font-size: 0.9rem; }
    .btn-login {
      display: inline-block;
      margin-top: 8px;
      background: var(--green);
      color: #fff;
      padding: 11px 26px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn-login:hover { background: var(--green-light); }

    /* ── Stats Strip ── */
    .stats-strip {
      display: none;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      flex: 1;
      min-width: 80px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
    }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

    /* ── Filter Tabs ── */
    .filter-tabs {
      display: none;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ── Orders Container ── */
    #orders-container { display: flex; flex-direction: column; gap: 12px; }

    /* ── Order Card ── */
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .order-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .order-num {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
    }
    .order-date { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pending    { background: #fff3cd; color: #856404; }
    .status-confirmed  { background: #d1e7dd; color: #0f5132; }
    .status-processing { background: #cfe2ff; color: #084298; }
    .status-shipped    { background: #e2d9f3; color: #432874; }
    .status-delivered  { background: #d1e7dd; color: #0a3622; border: 1.5px solid #0f5132; }
    .status-cancelled  { background: #f8d7da; color: #721c24; }

    /* Items list inside card */
    .order-items-list {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 0.87rem;
      border-bottom: 1px dashed var(--border);
      gap: 8px;
    }
    .order-item-row:last-child { border-bottom: none; }
    .item-name { color: var(--text); flex: 1; }
    .item-qty {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .item-price { color: var(--green); font-weight: 600; min-width: 56px; text-align: right; }

    /* Delivery address row */
    .order-address {
      padding: 7px 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 5px;
      align-items: flex-start;
    }

    /* Card footer */
    .order-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .order-total-label { font-size: 0.76rem; color: var(--text-muted); }
    .order-total-amt {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green);
    }
    .order-actions { display: flex; gap: 8px; align-items: center; }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-wa:hover { background: #1ebe5d; }

    .btn-reorder {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--saffron-pale);
      color: var(--saffron);
      border: 1.5px solid var(--saffron);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-reorder:hover { background: #fde8c8; }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 6px;
    }
    .empty-state p { font-size: 0.9rem; margin-bottom: 20px; }
    .btn-shop {
      display: inline-block;
      background: var(--saffron);
      color: #fff;
      padding: 11px 24px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.92rem;
      transition: background 0.2s;
    }
    .btn-shop:hover { background: var(--saffron-light); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green);
      color: #fff;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s, opacity 0.3s;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) {
      .order-card-head { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- ══ Topbar ══ -->
  <div class="topbar">
    <a href="index.html" class="topbar-brand">🛒 <span>AGS</span></a>
    <div class="topbar-title">📦 My Orders</div>
    <a href="profile.html" class="btn-back">← Profile</a>
  </div>

  <!-- ══ Page Wrap ══ -->
  <div class="page-wrap">
    <h1>My Orders</h1>
    <p class="page-subtitle">Aapke saare orders yahan dikhenge</p>

    <!-- Stats -->
    <div class="stats-strip" id="stats-strip">
      <div class="stat-pill">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stat-pending" style="color:var(--saffron)">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stat-delivered" style="color:#0f5132">0</div>
        <div class="stat-label">Delivered</div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filter-tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="pending">⏳ Pending</button>
      <button class="tab-btn" data-filter="confirmed">✅ Confirmed</button>
      <button class="tab-btn" data-filter="processing">🔄 Processing</button>
      <button class="tab-btn" data-filter="shipped">🚚 Shipped</button>
      <button class="tab-btn" data-filter="delivered">📬 Delivered</button>
      <button class="tab-btn" data-filter="cancelled">❌ Cancelled</button>
    </div>

    <!-- Orders -->
    <div id="orders-container">
      <div class="loading">
        <div class="spinner"></div>
        <p>⏳ Loading your orders…</p>
      </div>
    </div>

    <!-- Auth Gate -->
    <div id="auth-gate">
      <div class="gate-icon">🔐</div>
      <h2>Login karo pehle</h2>
      <p>Orders dekhne ke liye login zaroori hai</p>
      <a href="login.html" class="btn-login">Login / Sign Up</a>
    </div>
  </div>

  <div id="toast"></div>

  <!-- ══ Firebase ══ -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    /* ── Config ── */
    const firebaseConfig = {
      apiKey:            "AIzaSyB9Z7K293ydkuy2jZHpqzawDBI-FtZVB6o",
      authDomain:        "ankit-general-store-33443.firebaseapp.com",
      projectId:         "ankit-general-store-33443",
      storageBucket:     "ankit-general-store-33443.firebasestorage.app",
      messagingSenderId: "46126405791",
      appId:             "1:46126405791:web:e2dca04c30a1ec303caaaa",
      measurementId:     "G-TD2KF7CHP1"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const $ = id => document.getElementById(id);

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'show';
      setTimeout(() => t.className = '', 2800);
    }

    function fmtDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    const STATUS_LABEL = {
      pending:    '⏳ Pending',
      confirmed:  '✅ Confirmed',
      processing: '🔄 Processing',
      shipped:    '🚚 Shipped',
      delivered:  '📬 Delivered',
      cancelled:  '❌ Cancelled'
    };

    /* ── Auth ── */
    onAuthStateChanged(auth, async user => {
      if (!user) {
        $('orders-container').style.display = 'none';
        $('auth-gate').style.display = 'flex';
        return;
      }
      await loadOrders(user.uid);
    });

    let allOrders = [];

    /* ── Load Orders from Firestore ── */
    async function loadOrders(uid) {
      const container = $('orders-container');
      try {
        /* Try with orderBy first (needs composite index) */
        const q = query(
          collection(db, 'orders'),
          where('userId', '==', uid),
          orderBy('createdAt', 'desc')
        );
        const snap = await getDocs(q);
        allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        /* Fallback: without orderBy, sort client-side */
        try {
          const q2 = query(collection(db, 'orders'), where('userId', '==', uid));
          const snap2 = await getDocs(q2);
          allOrders = snap2.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => {
              const ta = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
              const tb = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
              return tb - ta;
            });
        } catch (e2) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <h3>Orders load nahi hue</h3>
              <p style="font-size:0.8rem;font-family:monospace">${e2.message}</p>
            </div>`;
          return;
        }
      }

      /* Fallback: kuch purane orders 'uid' field se save hue ho sakte hain */
      if (allOrders.length === 0) {
        try {
          const q3 = query(collection(db, 'orders'), where('uid', '==', uid));
          const snap3 = await getDocs(q3);
          if (!snap3.empty) {
            allOrders = snap3.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .sort((a, b) => {
                const ta = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
                const tb = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
                return tb - ta;
              });
          }
        } catch (_) { /* ignore */ }
      }

      if (allOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🛒</div>
            <h3>Koi order nahi mila</h3>
            <p>Abhi tak koi order place nahi kiya aapne.</p>
            <a href="products.html" class="btn-shop">Shop karo →</a>
          </div>`;
        return;
      }

      /* Show stats + filters */
      const pending   = allOrders.filter(o => o.status === 'pending').length;
      const delivered = allOrders.filter(o => o.status === 'delivered').length;
      $('stat-total').textContent     = allOrders.length;
      $('stat-pending').textContent   = pending;
      $('stat-delivered').textContent = delivered;
      $('stats-strip').style.display  = 'flex';
      $('filter-tabs').style.display  = 'flex';

      renderOrders('all');

      /* Tab filter logic */
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderOrders(btn.dataset.filter);
        });
      });
    }

    /* ── Render filtered list ── */
    function renderOrders(filter) {
      const container = $('orders-container');
      const list = filter === 'all'
        ? allOrders
        : allOrders.filter(o => (o.status || 'pending') === filter);

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>Koi order nahi</h3>
            <p>Is category mein abhi koi order nahi hai.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(buildCard).join('');

      /* WhatsApp button listener */
      container.querySelectorAll('.btn-wa').forEach(btn => {
        btn.addEventListener('click', () => {
          const msg = encodeURIComponent(
            `🛒 *AGS Order Enquiry*\n\nOrder ID: ${btn.dataset.id}\nStatus: ${STATUS_LABEL[btn.dataset.status] || btn.dataset.status}\n\nKripya mera order status batayein.`
          );
          window.open(`https://wa.me/917617263817?text=${msg}`, '_blank');
        });
      });
    }

    /* ── Build one order card ── */
    function buildCard(o) {
      const status      = o.status || 'pending';
      const statusLabel = STATUS_LABEL[status] || status;
      const shortId     = o.id.slice(0, 8).toUpperCase();
      const dateStr     = fmtDate(o.createdAt);
      const timeStr     = fmtTime(o.createdAt);

      /* Items rows */
      let itemsHtml = '';
      if (Array.isArray(o.items) && o.items.length > 0) {
        itemsHtml = o.items.map(item => {
          const qty   = item.qty || item.quantity || 1;
          const price = (item.price || 0) * qty;
          return `<div class="order-item-row">
            <span class="item-name">${item.name || 'Item'}</span>
            <span class="item-qty">×${qty}</span>
            <span class="item-price">₹${price}</span>
          </div>`;
        }).join('');
      } else if (o.itemsSummary) {
        itemsHtml = `<div class="order-item-row">
          <span class="item-name">${o.itemsSummary}</span>
          <span class="item-qty">${o.itemCount || ''} items</span>
          <span class="item-price">₹${o.totalAmount || o.total || 0}</span>
        </div>`;
      } else {
        itemsHtml = `<div style="font-size:0.84rem;color:var(--text-muted);padding:6px 0">
          Item detail available nahi hai
        </div>`;
      }

      /* Delivery address — o.address is an object {address, city, pincode, state} */
      const addrObj = (typeof o.address === 'object' && o.address !== null) ? o.address : {};
      const addrParts = [addrObj.address, addrObj.city, addrObj.pincode].filter(Boolean);
      const addrStr = addrParts.length > 0 ? addrParts.join(', ') : (typeof o.address === 'string' ? o.address : '');
      const addrHtml = addrStr
        ? `<div class="order-address">📍 <span>${addrStr}</span></div>`
        : '';

      /* WhatsApp button — hide after delivered/cancelled */
      const showWa = !['delivered', 'cancelled'].includes(status);

      return `
        <div class="order-card" data-status="${status}">

          <div class="order-card-head">
            <div>
              <div class="order-num">Order #${shortId}</div>
              <div class="order-date">${dateStr}${timeStr ? ' &nbsp;·&nbsp; ' + timeStr : ''}</div>
            </div>
            <span class="status-badge status-${status}">${statusLabel}</span>
          </div>

          ${addrHtml}

          <div class="order-items-list">
            ${itemsHtml}
          </div>

          <div class="order-card-foot">
            <div>
              <div class="order-total-label">Order Total</div>
              <div class="order-total-amt">₹${o.totalAmount || o.total || 0}</div>
            </div>
            <div class="order-actions">
              ${showWa
                ? `<button class="btn-wa" data-id="${o.id}" data-status="${status}">💬 WhatsApp</button>`
                : ''}
              <a href="products.html" class="btn-reorder">🔄 Reorder</a>
            </div>
          </div>

        </div>`;
    }
  </script>
</body>
</html>
