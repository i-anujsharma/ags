<!-- ════════════════════════════════════
     PART C: JavaScript — add to <script type="module">
     ════════════════════════════════════ -->
<script type="module">

import { buyNow } from "./order.js";

// ── CART FUNCTIONS ──────────────────────────────────────

const CART_KEY = "ags_cart";

function getCart() {
  return JSON.parse(localStorage.getItem(CART_KEY) || "[]");
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const cart = getCart();
  const total = cart.reduce((sum, i) => sum + i.qty, 0);
  const badge = document.getElementById("cart-count");
  if (badge) badge.textContent = total;
}

// ── ADD TO CART ──────────────────────────────────────────
window.addToCart = function(product) {
  const cart = getCart();
  const existing = cart.find(i => i.id === product.id);

  if (existing) {
    existing.qty += 1;
    showToast(`✅ ${product.name} — qty updated to ${existing.qty}`);
  } else {
    cart.push({ ...product, qty: 1 });
    showToast(`🛒 "${product.name}" added to cart!`);
  }

  saveCart(cart);

  // Update button appearance
  const btn = document.querySelector(`.product-card[data-id="${product.id}"] .btn-add-cart`);
  if (btn) {
    btn.textContent = "✅ Added";
    btn.classList.add("in-cart");
    setTimeout(() => {
      btn.innerHTML = "🛒 Add to Cart";
      btn.classList.remove("in-cart");
    }, 1500);
  }
};

// ── BUY NOW ─────────────────────────────────────────────
window.buyNowProduct = function(product) {
  buyNow(product);  // from order.js — goes straight to checkout
};

// ── TOAST ────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById("ags-toast");
  if (!t) return;
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => (t.style.display = "none"), 2500);
}

// ── INIT ─────────────────────────────────────────────────
updateCartBadge();

</script>
