<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="logo-icon">🛒</div><span>AGS</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html" class="active">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="nav-auth"><a href="login.html">Login</a></li>
      <li><a href="cart.html" class="nav-cart">🛒 Cart<span class="cart-badge" style="display:none">0</span></a></li>
    </ul>
    <button class="dark-toggle">🌙</button>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>
<nav class="nav-mobile" id="nav-mobile">
  <a href="index.html">🏠 Home</a><a href="products.html">📦 Products</a>
  <a href="cart.html">🛒 Cart</a><a href="login.html" id="mob-auth">👤 Login</a>
</nav>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span>/</span>
    <a href="products.html">Products</a><span>/</span>
    <span id="bc-name">Product</span>
  </div>

  <div id="detail-wrap" class="product-detail fade-in">
    <p style="color:var(--text-2);grid-column:1/-1">Loading product…</p>
  </div>
</div>

<footer class="footer" style="margin-top:60px">
  <div class="container">
    <div class="footer-bottom"><p>© 2025 Ankit General Store (AGS)</p></div>
  </div>
</footer>
<a href="https://wa.me/917617263817" class="wa-float" target="_blank">💬</a>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { fetchProduct } from "./js/products.js";
  import { updateCartBadge, initDarkMode, addToCart, formatPrice, showToast } from "./js/utils.js";

  initDarkMode();
  updateCartBadge();

  document.getElementById("hamburger")?.addEventListener("click", () => document.getElementById("nav-mobile")?.classList.toggle("open"));
  onAuthStateChanged(auth, user => { if(user) document.getElementById("nav-auth").innerHTML=`<a href="profile.html">👤 ${user.displayName||"Profile"}</a>`; });

  const id = new URLSearchParams(window.location.search).get("id");
  const wrap = document.getElementById("detail-wrap");

  if (!id) { wrap.innerHTML = `<p style="color:var(--red)">No product specified.</p>`; }
  else {
    const p = await fetchProduct(id).catch(() => null);
    if (!p) {
      wrap.innerHTML = `<p style="color:var(--red)">Product not found.</p>`;
    } else {
      document.title = p.name + " — AGS";
      document.getElementById("bc-name").textContent = p.name;

      const stockBadge = p.stock === 0
        ? `<span class="badge badge-out">Out of Stock</span>`
        : p.stock < 10
          ? `<span class="badge badge-low">Low Stock — ${p.stock} left</span>`
          : `<span class="badge badge-in">In Stock (${p.stock})</span>`;

      wrap.innerHTML = `
        <div class="detail-img">
          ${p.imageURL
            ? `<img src="${p.imageURL}" alt="${p.name}">`
            : `<div class="img-placeholder" style="aspect-ratio:1;font-size:5rem">🛒</div>`}
        </div>
        <div class="detail-info">
          <span class="detail-cat">${p.category}</span>
          <h1 class="detail-name">${p.name}</h1>
          <p class="detail-price">${formatPrice(p.price)}</p>
          <p class="detail-desc">${p.description || "No description available."}</p>
          ${stockBadge}
          <div class="qty-wrap" style="margin-top:20px">
            <label>Quantity:</label>
            <div class="qty-ctrl">
              <button class="qty-btn" id="qty-minus">−</button>
              <span class="qty-num" id="qty-num">1</span>
              <button class="qty-btn" id="qty-plus" ${p.stock===0?"disabled":""}>+</button>
            </div>
          </div>
          <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;">
            <button id="add-cart-btn" class="btn btn-green detail-add" ${p.stock===0?"disabled":""}>
              ${p.stock===0?"Out of Stock":"🛒 Add to Cart"}
            </button>
            <a href="cart.html" class="btn btn-primary detail-add" id="go-cart" style="display:none">View Cart →</a>
          </div>
          <div style="margin-top:24px;padding:16px;background:var(--green-lt);border-radius:var(--radius-sm);">
            <p style="font-size:.9rem;color:var(--green-dark)">💬 <strong>Order via WhatsApp</strong> — Add to cart and checkout to place your order instantly on WhatsApp.</p>
          </div>
        </div>`;

      let qty = 1;
      const numEl = document.getElementById("qty-num");
      document.getElementById("qty-minus").addEventListener("click", () => { if(qty>1){qty--;numEl.textContent=qty;} });
      document.getElementById("qty-plus").addEventListener("click", () => { if(qty<p.stock){qty++;numEl.textContent=qty;} });
      document.getElementById("add-cart-btn")?.addEventListener("click", () => {
        addToCart(p, qty);
        document.getElementById("go-cart").style.display = "inline-flex";
      });
    }
  }
</script>
</body>
</html>
