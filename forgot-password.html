<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🛒</div>
        <span>AGS</span>
      </a>
      <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
      <button class="dark-toggle">🌙</button>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card fade-in">

      <div class="auth-logo">
        <div class="logo-icon-lg">🔑</div>
        <h1>Reset Password</h1>
        <p>We'll send a reset link to your email</p>
      </div>

      <!-- Form -->
      <div id="reset-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
        </div>

        <div id="error-box"
          style="display:none;background:var(--red-lt);color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:14px;">
        </div>

        <button id="reset-btn" class="btn btn-green btn-block">
          Send Reset Link
        </button>
      </div>

      <!-- Success state -->
      <div id="success-state" style="display:none;text-align:center;padding:20px 0">
        <div style="font-size:3.5rem;margin-bottom:16px">📧</div>
        <h3 style="margin-bottom:8px">Email Sent!</h3>
        <p style="color:var(--text-2);font-size:.92rem;line-height:1.6">
          Check your inbox for the password reset link.<br>
          Check your spam folder if you don't see it.
        </p>
        <a href="login.html" class="btn btn-green" style="margin-top:20px;display:inline-flex">
          ← Back to Login
        </a>
      </div>

      <div class="auth-link" id="back-link" style="margin-top:16px">
        <a href="login.html">← Back to Login</a>
      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ── Paste your Firebase config here ─────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyB9Z7K293ydkuy2jZHpqzawDBI-FtZVB6o",
      authDomain: "ankit-general-store-33443.firebaseapp.com",
      projectId: "ankit-general-store-33443",
      storageBucket: "ankit-general-store-33443.firebasestorage.app",
      messagingSenderId: "46126405791",
      appId: "1:46126405791:web:e2dca04c30a1ec303caaaa",
      measurementId: "G-TD2KF7CHP1"
    };
    // ────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Dark mode
    const saved = localStorage.getItem("ags_dark");
    if (saved === "1") document.body.classList.add("dark");
    document.querySelectorAll(".dark-toggle").forEach(btn => {
      btn.textContent = document.body.classList.contains("dark") ? "☀" : "🌙";
      btn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("ags_dark", document.body.classList.contains("dark") ? "1" : "0");
        btn.textContent = document.body.classList.contains("dark") ? "☀" : "🌙";
      });
    });

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.style.display = "block";
    }

    document.getElementById("reset-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("reset-btn");

      document.getElementById("error-box").style.display = "none";

      if (!email) { showError("Please enter your email address."); return; }

      btn.textContent = "Sending…";
      btn.disabled = true;

      try {
        await sendPasswordResetEmail(auth, email);
        document.getElementById("reset-form").style.display = "none";
        document.getElementById("back-link").style.display = "none";
        document.getElementById("success-state").style.display = "block";
      } catch (err) {
        const map = {
          "auth/user-not-found": "No account found with this email address.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/too-many-requests": "Too many attempts. Please try again later.",
        };
        showError(map[err.code] || "Failed to send reset email. Please try again.");
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      }
    });

    document.getElementById("email").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("reset-btn").click();
    });

  </script>
</body>

</html>
