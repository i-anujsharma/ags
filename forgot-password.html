<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="logo-icon">🛒</div><span>AGS</span></a>
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Sign Up</a></li>
    </ul>
    <button class="dark-toggle">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon-lg">🔑</div>
      <h1>Reset Password</h1>
      <p>We'll send a reset link to your email</p>
    </div>

    <div id="reset-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com">
      </div>
      <p id="error-msg" class="form-error"></p>
      <button id="reset-btn" class="btn btn-green btn-block">Send Reset Link</button>
    </div>

    <div id="success-msg" style="display:none;text-align:center;padding:20px 0">
      <div style="font-size:3rem;margin-bottom:12px">📧</div>
      <h3 style="margin-bottom:8px">Email Sent!</h3>
      <p style="color:var(--text-2);font-size:.9rem">Check your inbox for the password reset link.</p>
    </div>

    <div class="auth-link">
      <a href="login.html">← Back to Login</a>
    </div>
  </div>
</div>

<script type="module">
  import { resetPassword } from "./js/auth.js";
  import { initDarkMode, showToast } from "./js/utils.js";

  initDarkMode();

  document.getElementById("reset-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const errEl = document.getElementById("error-msg");
    errEl.style.display = "none";

    if (!email) { errEl.textContent = "Please enter your email."; errEl.style.display = "block"; return; }

    const btn = document.getElementById("reset-btn");
    btn.textContent = "Sending…"; btn.disabled = true;

    try {
      await resetPassword(email);
      document.getElementById("reset-form").style.display = "none";
      document.getElementById("success-msg").style.display = "block";
    } catch(e) {
      const msgs = { "auth/user-not-found":"No account with this email.", "auth/invalid-email":"Invalid email." };
      errEl.textContent = msgs[e.code] || e.message;
      errEl.style.display = "block";
      btn.textContent = "Send Reset Link"; btn.disabled = false;
    }
  });
</script>
</body>
</html>
