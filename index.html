<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGS — Ankit General Store, Mihona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Mukta:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <section class="hero">
        <div class="signboard">
          <p class="sign-top">Ankit General Store</p>
          <h1>Ghar ka saaman, ghar tak.</h1>
          <p class="sign-sub">Grocery, household, personal care aur innerwear. RARI, Mihona.</p>
        </div>
        <label class="search-wrap">
          <span class="sr-only">Search products</span>
          <input id="search" type="search" placeholder="Product search karo, jaise atta ya soap" />
        </label>
      </section>
      <section class="shop">
        <div id="chips" class="chips" role="group" aria-label="Categories"></div>
        <div id="grid" class="grid"></div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/home.js"></script>
  </body>
</html>
