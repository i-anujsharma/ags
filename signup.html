<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="logo-icon">🛒</div><span>AGS</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html" class="nav-cart">🛒 Cart<span class="cart-badge" style="display:none">0</span></a></li>
    </ul>
    <button class="dark-toggle">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon-lg">🛒</div>
      <h1>Create Account</h1>
      <p>Join AGS and shop online!</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" class="form-input" placeholder="Anuj Sharma" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password <span style="color:var(--text-3);font-size:.8rem;">(min. 6 characters)</span></label>
      <div style="position:relative">
        <input type="password" id="password" class="form-input" placeholder="Choose a strong password" style="padding-right:44px">
        <button id="toggle-pw" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--text-2)">👁</button>
      </div>
      <div id="pw-strength" style="height:3px;border-radius:2px;background:var(--border);margin-top:8px;transition:all .3s"><div id="pw-bar" style="height:100%;border-radius:2px;width:0;transition:all .3s"></div></div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-pw" class="form-input" placeholder="Repeat your password">
    </div>

    <p id="error-msg" class="form-error"></p>

    <button id="signup-btn" class="btn btn-green btn-block">Create Account</button>

    <div class="auth-link">
      Already have an account? <a href="login.html">Login →</a>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { registerUser } from "./js/auth.js";
  import { showToast, updateCartBadge, initDarkMode } from "./js/utils.js";

  initDarkMode();
  updateCartBadge();

  onAuthStateChanged(auth, user => { if(user) window.location.href = "index.html"; });

  document.getElementById("toggle-pw").addEventListener("click", () => {
    const pw = document.getElementById("password");
    pw.type = pw.type === "password" ? "text" : "password";
  });

  // Password strength indicator
  document.getElementById("password").addEventListener("input", e => {
    const val = e.target.value;
    const bar = document.getElementById("pw-bar");
    let strength = 0;
    if (val.length >= 6) strength++;
    if (val.length >= 10) strength++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;
    const colors = ["", "#ef4444", "#f59e0b", "#22c55e", "#15803d"];
    const widths = ["0%", "25%", "50%", "75%", "100%"];
    bar.style.width = widths[strength];
    bar.style.background = colors[strength];
  });

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const name  = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const pw    = document.getElementById("password").value;
    const cpw   = document.getElementById("confirm-pw").value;
    const errEl = document.getElementById("error-msg");
    errEl.style.display = "none";

    if (!name||!email||!pw||!cpw) { errEl.textContent="All fields are required."; errEl.style.display="block"; return; }
    if (pw.length < 6)            { errEl.textContent="Password must be at least 6 characters."; errEl.style.display="block"; return; }
    if (pw !== cpw)               { errEl.textContent="Passwords do not match."; errEl.style.display="block"; return; }

    const btn = document.getElementById("signup-btn");
    btn.textContent = "Creating account…"; btn.disabled = true;

    try {
      await registerUser(name, email, pw);
      showToast("Account created! Welcome to AGS.", "success");
      setTimeout(() => window.location.href = "index.html", 900);
    } catch(e) {
      const msgs = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email":        "Invalid email address.",
        "auth/weak-password":        "Password is too weak."
      };
      errEl.textContent = msgs[e.code] || e.message;
      errEl.style.display = "block";
      btn.textContent = "Create Account"; btn.disabled = false;
    }
  });
</script>
</body>
</html>
