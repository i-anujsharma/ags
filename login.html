<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · AGS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Mukta:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <h1>Login ya naya account</h1>
      <p id="msg" class="err"></p>
      <div class="two">
        <form id="login-form" class="box">
          <h2>Login</h2>
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button class="btn">Login</button>
        </form>
        <form id="signup-form" class="box">
          <h2>Sign up</h2>
          <input name="name" placeholder="Naam" required />
          <input name="phone" type="tel" placeholder="Phone" required />
          <input name="email" type="email" placeholder="Email" required />
          <input
            name="password"
            type="password"
            minlength="6"
            placeholder="Password (min 6)"
            required
          />
          <button class="btn">Account banao</button>
        </form>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
