<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="logo-icon">🛒</div><span>AGS</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html" class="nav-cart">🛒 Cart<span class="cart-badge" style="display:none">0</span></a></li>
    </ul>
    <button class="dark-toggle">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon-lg">🛒</div>
      <h1>Welcome Back!</h1>
      <p>Login to your AGS account</p>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <div style="position:relative">
        <input type="password" id="password" class="form-input" placeholder="Your password" autocomplete="current-password" style="padding-right:44px">
        <button id="toggle-pw" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--text-2)">👁</button>
      </div>
    </div>

    <div style="text-align:right;margin:-8px 0 16px">
      <a href="forgot-password.html" style="color:var(--green);font-size:.88rem;font-weight:600;">Forgot password?</a>
    </div>

    <p id="error-msg" class="form-error"></p>

    <button id="login-btn" class="btn btn-green btn-block">Login</button>

    <div class="auth-link">
      New to AGS? <a href="signup.html">Create account →</a>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { loginUser } from "./js/auth.js";
  import { showToast, updateCartBadge, initDarkMode } from "./js/utils.js";

  initDarkMode();
  updateCartBadge();

  onAuthStateChanged(auth, user => { if(user) window.location.href = "index.html"; });

  document.getElementById("toggle-pw").addEventListener("click", () => {
    const pw = document.getElementById("password");
    pw.type = pw.type === "password" ? "text" : "password";
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const pw    = document.getElementById("password").value;
    const errEl = document.getElementById("error-msg");
    errEl.style.display = "none";

    if (!email || !pw) { errEl.textContent = "Please fill in all fields."; errEl.style.display = "block"; return; }

    const btn = document.getElementById("login-btn");
    btn.textContent = "Logging in…"; btn.disabled = true;

    try {
      await loginUser(email, pw);
      showToast("Login successful! Welcome back.", "success");
      setTimeout(() => window.location.href = "index.html", 800);
    } catch(e) {
      const msgs = {
        "auth/user-not-found":   "No account found with this email.",
        "auth/wrong-password":   "Incorrect password. Try again.",
        "auth/too-many-requests":"Too many failed attempts. Try later.",
        "auth/invalid-email":    "Invalid email address."
      };
      errEl.textContent = msgs[e.code] || e.message;
      errEl.style.display = "block";
      btn.textContent = "Login"; btn.disabled = false;
    }
  });

  document.getElementById("password").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("login-btn").click(); });
</script>
</body>
</html>
