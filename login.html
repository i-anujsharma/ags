<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ankit General Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">🛒</div>
      <span>AGS</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li>
        <a href="cart.html" class="nav-cart">
          🛒 Cart
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </li>
    </ul>
    <button class="dark-toggle">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card fade-in">

    <div class="auth-logo">
      <div class="logo-icon-lg">🛒</div>
      <h1>Welcome Back!</h1>
      <p>Login to your AGS account</p>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        class="form-input"
        placeholder="you@example.com"
        autocomplete="email"
      >
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <div style="position:relative">
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="Your password"
          autocomplete="current-password"
          style="padding-right:44px"
        >
        <button
          id="toggle-pw"
          type="button"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--text-2)"
        >👁</button>
      </div>
    </div>

    <!-- Forgot password link -->
    <div style="text-align:right;margin:-8px 0 16px">
      <a href="forgot-password.html" style="color:var(--green);font-size:.88rem;font-weight:600;">
        Forgot password?
      </a>
    </div>

    <!-- Error message -->
    <div
      id="error-box"
      style="display:none;background:var(--red-lt);color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:14px;"
    ></div>

    <!-- Success message -->
    <div
      id="success-box"
      style="display:none;background:#dcfce7;color:#15803d;padding:10px 14px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:14px;"
    ></div>

    <!-- Login button -->
    <button id="login-btn" class="btn btn-green btn-block">
      Login
    </button>

    <div class="auth-link" style="margin-top:16px">
      New to AGS? <a href="signup.html">Create account →</a>
    </div>

  </div>
</div>

<!-- ── All Firebase logic in one self-contained module ── -->
<script type="module">

  // ── Import Firebase directly (CDN) ──────────────────────────
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ── Paste your Firebase config here ─────────────────────────
  // (same values as in js/firebase.js)
  const firebaseConfig = {
    apiKey:            "YOUR_API_KEY",
    authDomain:        "YOUR_AUTH_DOMAIN",
    projectId:         "YOUR_PROJECT_ID",
    storageBucket:     "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId:             "YOUR_APP_ID"
  };
  // ────────────────────────────────────────────────────────────

  // Init Firebase
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);

  // Dark mode
  const saved = localStorage.getItem("ags_dark");
  if (saved === "1") document.body.classList.add("dark");
  document.querySelectorAll(".dark-toggle").forEach(btn => {
    btn.textContent = document.body.classList.contains("dark") ? "☀" : "🌙";
    btn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("ags_dark", document.body.classList.contains("dark") ? "1" : "0");
      btn.textContent = document.body.classList.contains("dark") ? "☀" : "🌙";
    });
  });

  // Cart badge
  const cart = JSON.parse(localStorage.getItem("ags_cart") || "[]");
  const total = cart.reduce((s, i) => s + i.qty, 0);
  document.querySelectorAll(".cart-badge").forEach(b => {
    if (total > 0) { b.textContent = total; b.style.display = "flex"; }
  });

  // If already logged in → redirect to home
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "index.html";
  });

  // Show/hide password
  document.getElementById("toggle-pw").addEventListener("click", () => {
    const pw = document.getElementById("password");
    pw.type = pw.type === "password" ? "text" : "password";
  });

  // Helper: show error
  function showError(msg) {
    const box = document.getElementById("error-box");
    box.textContent = msg;
    box.style.display = "block";
    document.getElementById("success-box").style.display = "none";
  }

  // Helper: show success
  function showSuccess(msg) {
    const box = document.getElementById("success-box");
    box.textContent = msg;
    box.style.display = "block";
    document.getElementById("error-box").style.display = "none";
  }

  // Friendly error messages for all Firebase auth codes
  function friendlyError(code) {
    const map = {
      "auth/user-not-found":         "No account found with this email.",
      "auth/wrong-password":         "Incorrect password. Please try again.",
      "auth/invalid-credential":     "Incorrect email or password. Please try again.",
      "auth/invalid-email":          "Please enter a valid email address.",
      "auth/too-many-requests":      "Too many failed attempts. Please try again later.",
      "auth/user-disabled":          "This account has been disabled.",
      "auth/network-request-failed": "Network error. Please check your internet connection.",
      "auth/internal-error":         "Something went wrong. Please try again.",
    };
    return map[code] || "Login failed: " + code;
  }

  // Login button click
  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const pw    = document.getElementById("password").value;
    const btn   = document.getElementById("login-btn");

    // Clear previous messages
    document.getElementById("error-box").style.display   = "none";
    document.getElementById("success-box").style.display = "none";

    // Basic validation
    if (!email) { showError("Please enter your email address."); return; }
    if (!pw)    { showError("Please enter your password."); return; }

    // Loading state
    btn.textContent = "Logging in…";
    btn.disabled    = true;

    try {
      await signInWithEmailAndPassword(auth, email, pw);
      showSuccess("✓ Login successful! Redirecting…");
      setTimeout(() => { window.location.href = "index.html"; }, 800);
    } catch (err) {
      showError(friendlyError(err.code));
      btn.textContent = "Login";
      btn.disabled    = false;
    }
  });

  // Allow Enter key to submit
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });
  document.getElementById("email").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });

</script>
</body>
</html>
